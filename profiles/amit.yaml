id: amit
privacy_default: hybrid          # local | hybrid | cloud
license_policy: commercial-ok    # internal-only | commercial-ok
budget_usd_per_task: 0.50
weights:                         # decision 4
  score: 0.40
  local: 0.20
  agent_ready: 0.15
  cost: 0.15
  fresh: 0.10
 
toolbox:
  enabled: true
  auto_validate_on_startup: true  # validate catalog on SessionStart
  min_tier_for_auto_delegation: 1 # cost tier threshold before auto-routing
  log_decisions: true             # append all decisions to ledger
  trace_on_outcome: true          # enable /toolbox:trace for review
