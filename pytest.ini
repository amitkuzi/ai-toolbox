[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    adversary: marks tests requiring LLM APIs (deselect with '-m "not adversary"')
    integration: marks integration tests
timeout = 300
