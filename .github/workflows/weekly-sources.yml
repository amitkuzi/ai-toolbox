name: weekly-sources

on:
  schedule:
    - cron: '0 8 * * 1'  # 08:00 UTC every Monday
  workflow_dispatch:     # Allow manual trigger

jobs:
  weekly-sources:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -q pyyaml python-ulid

      - name: Configure git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "AI Toolbox Curator"

      - name: Run weekly source curator
        id: curator
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          # Trigger the toolbox-curate skill (weekly run) via Claude Code
          # Phase 5 will add the actual Claude invocation
          python scripts/store.py project
          python scripts/validate.py
          echo "status=done" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Commit changes
        if: ${{ steps.curator.outcome == 'success' || steps.curator.outcome == 'failure' }}
        run: |
          if git diff --quiet catalog/ledger/ catalog/views/; then
            echo "No changes to commit"
          else
            git add catalog/ledger/ catalog/views/
            git commit -m "curate: weekly source refresh" \
              -m "Co-Authored-By: Claude Haiku 4.5 <noreply@anthropic.com>" || echo "Nothing to commit"
            git push
          fi
        continue-on-error: true

      - name: Notify on failure
        if: ${{ failure() }}
        run: |
          bash ops/notify.sh "weekly-sources-fail" "GitHub Actions workflow failed at $(date)" "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
