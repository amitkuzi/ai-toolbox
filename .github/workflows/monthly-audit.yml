name: monthly-audit

on:
  schedule:
    - cron: '0 9 1 * *'  # 09:00 UTC on the 1st of every month
  workflow_dispatch:     # Allow manual trigger

jobs:
  monthly-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -q pyyaml python-ulid

      - name: Configure git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "AI Toolbox Auditor"

      - name: Create audit branch
        run: |
          AUDIT_BRANCH="audit/monthly-$(date +%Y%m)"
          git checkout -b "$AUDIT_BRANCH" || git checkout "$AUDIT_BRANCH"
          echo "AUDIT_BRANCH=$AUDIT_BRANCH" >> $GITHUB_ENV

      - name: Run monthly auditor
        id: auditor
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          # Trigger the toolbox-auditor agent via Claude Code
          # Phase 5 will add the actual Claude invocation
          python scripts/store.py project
          python scripts/validate.py
          echo "status=done" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Create pull request
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require('child_process');
            const branch = process.env.AUDIT_BRANCH;

            // Check if there are changes
            try {
              execSync('git diff --quiet', { encoding: 'utf-8' });
              console.log('No changes to commit');
              return;
            } catch (e) {
              // Changes exist
            }

            // Push branch
            try {
              execSync(`git push -u origin ${branch}`);
            } catch (e) {
              console.log('Branch already exists or push failed');
            }

            // Create PR
            const title = `audit: monthly audit ${new Date().toISOString().slice(0,7)} (automated)`;
            const body = `## Monthly Audit

Generated by \`monthly-audit.yml\`.

**Review and approve to merge.**

Co-Authored-By: Claude Haiku 4.5 <noreply@anthropic.com>`;

            try {
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                head: branch,
                base: 'ai-toolbox',
              });
              console.log(`Created PR from ${branch}`);
            } catch (e) {
              if (e.status === 422) {
                console.log('PR already exists');
              } else {
                throw e;
              }
            }
        continue-on-error: true

      - name: Notify on failure
        if: ${{ failure() }}
        run: |
          bash ops/notify.sh "monthly-audit-fail" "GitHub Actions workflow failed at $(date)" "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
